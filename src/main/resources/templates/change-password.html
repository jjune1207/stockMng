<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 - 주식 분석 차트</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.25s, color 0.25s;
        }
        body[data-bs-theme="light"] {
            background-color: #f4f1ea !important;
            color: #2b2925;
        }
        body[data-bs-theme="light"] .change-card {
            background-color: #ede9e0;
            border-color: #c8c3b8;
        }
        body[data-bs-theme="light"] .form-control {
            background-color: #f4f1ea;
            border-color: #c8c3b8;
            color: #2b2925;
        }
        body[data-bs-theme="light"] .form-control:focus {
            background-color: #f4f1ea;
            color: #2b2925;
            border-color: #a89e90;
            box-shadow: 0 0 0 0.2rem rgba(43,41,37,0.1);
        }
        body[data-bs-theme="light"] .text-muted-label { color: #6b6760; }
        body[data-bs-theme="light"] .notice-box {
            background-color: #fff8e6;
            border-color: #f0c050;
            color: #7a5a00;
        }
        .change-card { width: 100%; max-width: 400px; }
        .notice-box {
            background-color: rgba(255, 193, 7, 0.12);
            border: 1px solid rgba(255, 193, 7, 0.4);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body class="bg-dark text-light" data-bs-theme="dark">

<div class="card change-card shadow bg-secondary bg-opacity-25 border border-secondary" id="changeCard">
    <div class="card-body p-4">
        <h5 class="card-title text-center mb-3 fw-bold">
            <i class="bi bi-key-fill text-warning me-2"></i>비밀번호 변경
        </h5>

        <div class="notice-box small">
            <i class="bi bi-exclamation-triangle-fill text-warning me-1"></i>
            관리자가 생성한 계정입니다. 서비스 이용 전 비밀번호를 변경해 주세요.
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small mb-3" th:text="${error}"></div>

        <form th:action="@{/change-password}" method="post">
            <div class="mb-3">
                <label class="form-label small text-muted-label">새 비밀번호</label>
                <input type="password" name="newPassword" id="newPassword"
                       class="form-control bg-dark text-light border-secondary"
                       required autocomplete="new-password" placeholder="4자 이상">
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted-label">비밀번호 확인</label>
                <input type="password" name="confirmPassword" id="confirmPassword"
                       class="form-control bg-dark text-light border-secondary"
                       required autocomplete="new-password" placeholder="비밀번호 재입력">
                <div class="form-text small mt-1" id="pwMatchMsg" style="min-height:1.2em;"></div>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-semibold mb-2">변경 후 시작하기</button>
            <button type="button" class="btn btn-outline-secondary w-100 btn-sm" onclick="toggleTheme()" id="themeToggle">
                <i class="bi bi-sun-fill me-1" id="themeIcon"></i><span id="themeLabel">라이트 모드</span>
            </button>
        </form>
    </div>
</div>

<script>
    document.getElementById('confirmPassword').addEventListener('input', function() {
        const msg = document.getElementById('pwMatchMsg');
        const isDark = document.body.getAttribute('data-bs-theme') === 'dark';
        if (this.value === '') { msg.textContent = ''; return; }
        if (this.value === document.getElementById('newPassword').value) {
            msg.textContent = '비밀번호가 일치합니다.';
            msg.className = 'form-text small mt-1 text-success';
        } else {
            msg.textContent = '비밀번호가 일치하지 않습니다.';
            msg.className = 'form-text small mt-1 text-danger';
        }
    });

    function getStoredTheme() {
        return localStorage.getItem('theme') || 'dark';
    }

    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.setAttribute('data-bs-theme', theme);
        document.body.className = isDark ? 'bg-dark text-light' : '';

        const card = document.getElementById('changeCard');
        card.className = isDark
            ? 'card change-card shadow bg-secondary bg-opacity-25 border border-secondary'
            : 'card change-card shadow border';

        ['newPassword', 'confirmPassword'].forEach(id => {
            const el = document.getElementById(id);
            el.className = isDark
                ? 'form-control bg-dark text-light border-secondary'
                : 'form-control';
        });

        document.getElementById('themeIcon').className = isDark ? 'bi bi-sun-fill me-1' : 'bi bi-moon-fill me-1';
        document.getElementById('themeLabel').textContent = isDark ? '라이트 모드' : '다크 모드';
        localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
        applyTheme(getStoredTheme() === 'dark' ? 'light' : 'dark');
    }

    (function() { applyTheme(getStoredTheme()); })();
</script>

</body>
</html>
