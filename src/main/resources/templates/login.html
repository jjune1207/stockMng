<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 주식 분석 차트</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.25s, color 0.25s;
        }
        body[data-bs-theme="light"] {
            background-color: #f4f1ea !important;
            color: #2b2925;
        }
        body[data-bs-theme="light"] .login-card {
            background-color: #ede9e0;
            border-color: #c8c3b8;
        }
        body[data-bs-theme="light"] .form-control {
            background-color: #f4f1ea;
            border-color: #c8c3b8;
            color: #2b2925;
        }
        body[data-bs-theme="light"] .form-control:focus {
            background-color: #f4f1ea;
            color: #2b2925;
            border-color: #a89e90;
            box-shadow: 0 0 0 0.2rem rgba(43,41,37,0.1);
        }
        body[data-bs-theme="light"] .text-muted-label { color: #6b6760; }
        body[data-bs-theme="light"] hr { border-color: #c8c3b8; }
        .login-card { width: 100%; max-width: 380px; }
    </style>
</head>
<body class="bg-dark text-light" data-bs-theme="dark">

<div class="card login-card shadow bg-secondary bg-opacity-25 border border-secondary" id="loginCard">
    <div class="card-body p-4">
        <h5 class="card-title text-center mb-4 fw-bold">
            <i class="bi bi-bar-chart-fill text-warning me-2"></i>주식 분석 차트
        </h5>

        <div th:if="${success}" class="alert alert-success py-2 small mb-3" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger py-2 small mb-3" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small text-muted-label" id="nameLabel">이름</label>
                <input type="text" name="name" id="nameInput"
                       class="form-control bg-dark text-light border-secondary"
                       required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted-label" id="pwLabel">비밀번호</label>
                <input type="password" name="password" id="pwInput"
                       class="form-control bg-dark text-light border-secondary"
                       required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-semibold mb-2">로그인</button>
            <button type="button" class="btn btn-outline-secondary w-100 btn-sm" onclick="toggleTheme()" id="themeToggle">
                <i class="bi bi-sun-fill me-1" id="themeIcon"></i><span id="themeLabel">라이트 모드</span>
            </button>
        </form>

        <hr class="border-secondary my-3" id="divider">
        <div class="text-center">
            <small class="text-muted-label" id="noAccountText">계정은 관리자에게 문의하세요.</small>
        </div>
    </div>
</div>

<script>
    function getStoredTheme() {
        return localStorage.getItem('theme') || 'dark';
    }

    function applyTheme(theme) {
        const isDark = theme === 'dark';
        document.body.setAttribute('data-bs-theme', theme);
        document.body.className = isDark ? 'bg-dark text-light' : '';

        const card = document.getElementById('loginCard');
        card.className = isDark
            ? 'card login-card shadow bg-secondary bg-opacity-25 border border-secondary'
            : 'card login-card shadow border';

        [document.getElementById('nameInput'), document.getElementById('pwInput')].forEach(el => {
            el.className = isDark
                ? 'form-control bg-dark text-light border-secondary'
                : 'form-control';
        });

        document.getElementById('themeIcon').className = isDark ? 'bi bi-sun-fill me-1' : 'bi bi-moon-fill me-1';
        document.getElementById('themeLabel').textContent = isDark ? '라이트 모드' : '다크 모드';

        const toggleBtn = document.getElementById('themeToggle');
        toggleBtn.className = isDark
            ? 'btn btn-outline-secondary w-100 btn-sm'
            : 'btn btn-outline-secondary w-100 btn-sm';

        localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
        applyTheme(getStoredTheme() === 'dark' ? 'light' : 'dark');
    }

    (function() { applyTheme(getStoredTheme()); })();
</script>

</body>
</html>
